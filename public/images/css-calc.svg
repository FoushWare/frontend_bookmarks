<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="600" height="200" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">calc() Function</text>
  
  <!-- Example 1 -->
  <rect x="20" y="50" width="260" height="60" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="150" y="75" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">calc(100% - 32px)</text>
  <rect x="20" y="50" width="260" height="60" rx="4" fill="#ff6b6b" opacity="0.2"/>
  <rect x="52" y="50" width="196" height="60" rx="4" fill="#4ecdc4" opacity="0.2"/>
  <text x="150" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">100% - 32px</text>
  
  <!-- Example 2 -->
  <rect x="320" y="50" width="260" height="60" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="450" y="75" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">calc((100% - 64px) / 3)</text>
  <rect x="320" y="50" width="260" height="60" rx="4" fill="#45b7d1" opacity="0.2"/>
  <rect x="352" y="50" width="196" height="60" rx="4" fill="#96ceb4" opacity="0.2"/>
  <rect x="352" y="50" width="65" height="60" rx="4" fill="#ff6b6b" opacity="0.2"/>
  <rect x="429" y="50" width="65" height="60" rx="4" fill="#ff6b6b" opacity="0.2"/>
  <rect x="506" y="50" width="42" height="60" rx="4" fill="#ff6b6b" opacity="0.2"/>
  <text x="450" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">3 equal columns</text>
  
  <!-- Example 3 -->
  <rect x="20" y="140" width="260" height="40" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="150" y="165" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">calc(16px + 1vw)</text>
  <text x="150" y="195" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Base + viewport</text>
  
  <!-- Example 4 -->
  <rect x="320" y="140" width="260" height="40" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="450" y="165" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">calc(100vh - 80px)</text>
  <text x="450" y="195" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Viewport - header</text>
</svg>
