<svg width="600" height="250" viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="600" height="250" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Border Radius</text>
  
  <!-- 8px all corners -->
  <rect x="20" y="50" width="130" height="80" rx="8" fill="#ff6b6b" stroke="#333" stroke-width="2"/>
  <text x="85" y="145" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">8px</text>
  
  <!-- 8px 16px -->
  <rect x="170" y="50" width="130" height="80" rx="8" ry="16" fill="#4ecdc4" stroke="#333" stroke-width="2"/>
  <text x="235" y="145" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">8px 16px</text>
  
  <!-- 8px 16px 4px 20px -->
  <rect x="320" y="50" width="130" height="80" fill="#45b7d1" stroke="#333" stroke-width="2"/>
  <path d="M 320 58 Q 320 50 328 50 L 462 50 Q 470 50 470 58 L 470 126 Q 470 134 462 134 L 328 134 Q 320 134 320 126 Z" fill="none" stroke="#333" stroke-width="2"/>
  <text x="395" y="145" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">8px 16px 4px 20px</text>
  
  <!-- 50% circle -->
  <rect x="470" y="50" width="110" height="80" rx="40" fill="#96ceb4" stroke="#333" stroke-width="2"/>
  <text x="525" y="145" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">50%</text>
  
  <!-- Individual corners -->
  <rect x="20" y="170" width="260" height="60" fill="#ff6b6b" stroke="#333" stroke-width="2"/>
  <path d="M 20 178 Q 20 170 28 170 L 60 170 L 60 178 Z" fill="#333" opacity="0.3"/>
  <path d="M 272 178 Q 272 170 264 170 L 232 170 L 232 178 Z" fill="#333" opacity="0.3"/>
  <path d="M 272 222 Q 272 230 264 230 L 232 230 L 232 222 Z" fill="#333" opacity="0.3"/>
  <path d="M 20 222 Q 20 230 28 230 L 60 230 L 60 222 Z" fill="#333" opacity="0.3"/>
  <text x="150" y="245" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Individual corners</text>
  
  <!-- Horizontal/Vertical radius -->
  <rect x="300" y="170" width="260" height="60" fill="#4ecdc4" stroke="#333" stroke-width="2"/>
  <text x="430" y="245" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">8px / 16px (horizontal / vertical)</text>
</svg>
