<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .boxA { fill:#4f86f7; stroke:#2955b8; stroke-width:2; }
    .boxB { fill:#7bc67e; stroke:#3a8a3e; stroke-width:2; }
    .boxC { fill:#f7a24f; stroke:#b8622a; stroke-width:2; }
    .container { fill:#eef2fb; stroke:#94a8d8; stroke-width:2; stroke-dasharray:6,4; }
    .label { fill:#1a1a2e; font-size:15px; font-weight:600; }
    .code { fill:#ffffff; font-size:13px; font-weight:600; }
  </style>

  <text x="20" y="25" class="label">flex-grow: 1, 2, 1 (extra space split 1:2:1)</text>
  <rect x="20" y="35" width="760" height="70" class="container" rx="6"/>
  <rect x="30" y="45" width="180" height="50" class="boxA" rx="4"/><text x="60" y="76" class="code">grow: 1</text>
  <rect x="220" y="45" width="360" height="50" class="boxB" rx="4"/><text x="360" y="76" class="code">grow: 2</text>
  <rect x="590" y="45" width="180" height="50" class="boxC" rx="4"/><text x="620" y="76" class="code">grow: 1</text>

  <text x="20" y="140" class="label">flex-shrink: 0 means "don't shrink me" when space is tight</text>
  <rect x="20" y="150" width="400" height="70" class="container" rx="6"/>
  <rect x="30" y="160" width="120" height="50" class="boxA" rx="4"/><text x="55" y="191" class="code">shrink: 1</text>
  <rect x="160" y="160" width="120" height="50" class="boxB" rx="4"/><text x="182" y="191" class="code">shrink: 0</text>
  <rect x="290" y="160" width="100" height="50" class="boxC" rx="4"/><text x="308" y="191" class="code">shrink: 1</text>
  <text x="440" y="180" class="label" font-size="13" font-weight="400">Green item holds its size;</text>
  <text x="440" y="200" class="label" font-size="13" font-weight="400">blue/orange give up space first.</text>

  <text x="20" y="255" class="label" font-size="14" font-weight="400">flex-basis sets the starting size before grow/shrink are applied -</text>
  <text x="20" y="277" class="label" font-size="14" font-weight="400">think of it as a smarter width/height that only applies along the main axis.</text>
</svg>
