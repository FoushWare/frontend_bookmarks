<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect width="800" height="460" fill="#0f172a" rx="12"/>

  <text x="400" y="34" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700">Common rel Attribute Values</text>

  <rect x="60" y="56" width="215" height="80" rx="8" fill="#1e293b" stroke="#5eead4" stroke-width="1.5"/>
  <text x="167" y="80" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="700">rel="stylesheet"</text>
  <text x="80" y="102" fill="#cbd5e1" font-size="10">Link a CSS file, applies</text>
  <text x="80" y="118" fill="#cbd5e1" font-size="10">to the current document</text>

  <rect x="292" y="56" width="215" height="80" rx="8" fill="#1e293b" stroke="#5eead4" stroke-width="1.5"/>
  <text x="399" y="80" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="700">rel="icon"</text>
  <text x="312" y="102" fill="#cbd5e1" font-size="10">Favicon — browser tab,</text>
  <text x="312" y="118" fill="#cbd5e1" font-size="10">bookmarks, history</text>

  <rect x="524" y="56" width="215" height="80" rx="8" fill="#1e293b" stroke="#5eead4" stroke-width="1.5"/>
  <text x="631" y="80" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="700">rel="canonical"</text>
  <text x="544" y="102" fill="#cbd5e1" font-size="10">Points to the "real" URL</text>
  <text x="544" y="118" fill="#cbd5e1" font-size="10">for duplicate content</text>

  <rect x="60" y="150" width="215" height="80" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
  <text x="167" y="174" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="700">rel="alternate"</text>
  <text x="80" y="196" fill="#cbd5e1" font-size="10">Alternate versions —</text>
  <text x="80" y="212" fill="#cbd5e1" font-size="10">RSS feed, other languages</text>

  <rect x="292" y="150" width="215" height="80" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
  <text x="399" y="174" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="700">rel="manifest"</text>
  <text x="312" y="196" fill="#cbd5e1" font-size="10">Links the PWA</text>
  <text x="312" y="212" fill="#cbd5e1" font-size="10">web app manifest</text>

  <rect x="524" y="150" width="215" height="80" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
  <text x="631" y="174" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="700">rel="noopener"</text>
  <text x="544" y="196" fill="#cbd5e1" font-size="10">Security: on target="_blank"</text>
  <text x="544" y="212" fill="#cbd5e1" font-size="10">links (see below)</text>

  <!-- resource hints timeline -->
  <text x="400" y="264" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">Resource Hints — How Early Each Starts</text>

  <line x1="80" y1="300" x2="720" y2="300" stroke="#334155" stroke-width="2"/>
  <text x="80" y="292" fill="#64748b" font-size="10">Page load starts</text>
  <text x="720" y="292" text-anchor="end" fill="#64748b" font-size="10">Resource needed</text>

  <circle cx="150" cy="300" r="8" fill="#0d9488"/>
  <text x="150" y="330" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="700">dns-prefetch</text>
  <text x="150" y="346" text-anchor="middle" fill="#94a3b8" font-size="10">DNS lookup only</text>

  <circle cx="330" cy="300" r="8" fill="#0f766e"/>
  <text x="330" y="330" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="700">preconnect</text>
  <text x="330" y="346" text-anchor="middle" fill="#94a3b8" font-size="10">DNS + TCP + TLS handshake</text>

  <circle cx="510" cy="300" r="8" fill="#134e4a"/>
  <text x="510" y="330" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="700">preload</text>
  <text x="510" y="346" text-anchor="middle" fill="#94a3b8" font-size="10">Fetches THIS resource now</text>

  <circle cx="650" cy="300" r="8" fill="#78350f"/>
  <text x="650" y="330" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">prefetch</text>
  <text x="650" y="346" text-anchor="middle" fill="#94a3b8" font-size="10">Low priority, for NEXT page</text>

  <rect x="60" y="380" width="680" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="400" y="404" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">preload = "I need this NOW, for this page"</text>
  <text x="400" y="422" text-anchor="middle" fill="#94a3b8" font-size="12">prefetch = "I'll probably need this LATER, for the next page"</text>
</svg>
