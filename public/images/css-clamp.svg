<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="600" height="200" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">clamp(min, preferred, max)</text>
  
  <!-- Viewport width line -->
  <line x1="50" y1="100" x2="550" y2="100" stroke="#333" stroke-width="2"/>
  <text x="300" y="120" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Viewport Width</text>
  
  <!-- Minimum value -->
  <line x1="50" y1="60" x2="150" y2="60" stroke="#ff6b6b" stroke-width="3"/>
  <line x1="50" y1="55" x2="50" y2="65" stroke="#ff6b6b" stroke-width="2"/>
  <line x1="150" y1="55" x2="150" y2="65" stroke="#ff6b6b" stroke-width="2"/>
  <text x="100" y="50" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#ff6b6b">min (16px)</text>
  
  <!-- Preferred value -->
  <line x1="150" y1="60" x2="450" y2="60" stroke="#4ecdc4" stroke-width="3"/>
  <text x="300" y="50" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#4ecdc4">preferred (4vw)</text>
  
  <!-- Maximum value -->
  <line x1="450" y1="60" x2="550" y2="60" stroke="#45b7d1" stroke-width="3"/>
  <line x1="450" y1="55" x2="450" y2="65" stroke="#45b7d1" stroke-width="2"/>
  <line x1="550" y1="55" x2="550" y2="65" stroke="#45b7d1" stroke-width="2"/>
  <text x="500" y="50" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#45b7d1">max (24px)</text>
  
  <!-- Result line -->
  <line x1="50" y1="140" x2="550" y2="140" stroke="#333" stroke-width="2"/>
  <text x="300" y="160" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Result Value</text>
  
  <!-- Result curve -->
  <path d="M 50 140 L 150 140 L 450 140 L 550 140" stroke="#96ceb4" stroke-width="3" fill="none"/>
  <circle cx="50" cy="140" r="4" fill="#ff6b6b"/>
  <circle cx="150" cy="140" r="4" fill="#4ecdc4"/>
  <circle cx="450" cy="140" r="4" fill="#4ecdc4"/>
  <circle cx="550" cy="140" r="4" fill="#45b7d1"/>
  
  <!-- Labels -->
  <text x="50" y="180" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Small screen</text>
  <text x="300" y="180" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Medium screen</text>
  <text x="550" y="180" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Large screen</text>
</svg>
