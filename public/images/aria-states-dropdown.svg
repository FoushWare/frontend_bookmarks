<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect width="800" height="460" fill="#0f172a" rx="12"/>

  <text x="400" y="34" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">Same button, two states</text>

  <!-- closed state -->
  <text x="190" y="66" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600">Collapsed</text>
  <rect x="70" y="80" width="240" height="46" rx="8" fill="#1e293b" stroke="#5eead4" stroke-width="1.5"/>
  <text x="190" y="107" text-anchor="middle" fill="#e2e8f0" font-size="13">Menu ▾</text>

  <rect x="70" y="140" width="240" height="86" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="190" y="165" text-anchor="middle" fill="#64748b" font-size="11">aria-expanded="false"</text>
  <text x="190" y="185" text-anchor="middle" fill="#64748b" font-size="11">aria-hidden="true"</text>
  <text x="190" y="205" text-anchor="middle" fill="#64748b" font-size="11">panel not announced</text>

  <!-- arrow between states -->
  <line x1="330" y1="103" x2="440" y2="103" stroke="#0d9488" stroke-width="2" marker-end="url(#ar)"/>
  <text x="385" y="90" text-anchor="middle" fill="#2dd4bf" font-size="11" font-weight="700">click</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0d9488"/>
    </marker>
  </defs>

  <!-- open state -->
  <text x="610" y="66" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600">Expanded</text>
  <rect x="490" y="80" width="240" height="46" rx="8" fill="#0f766e" stroke="#5eead4" stroke-width="1.5"/>
  <text x="610" y="107" text-anchor="middle" fill="#ffffff" font-size="13">Menu ▴</text>

  <rect x="490" y="140" width="240" height="86" rx="8" fill="#134e4a"/>
  <text x="610" y="165" text-anchor="middle" fill="#ccfbf1" font-size="11">aria-expanded="true"</text>
  <text x="610" y="185" text-anchor="middle" fill="#ccfbf1" font-size="11">aria-hidden="false"</text>
  <text x="610" y="205" text-anchor="middle" fill="#ccfbf1" font-size="11">panel announced &amp; focusable</text>

  <!-- table of common attributes -->
  <rect x="60" y="250" width="680" height="190" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="80" y="278" fill="#f1f5f9" font-size="13" font-weight="700">Frequently used states/properties</text>

  <text x="80" y="306" fill="#5eead4" font-size="12" font-weight="600">aria-expanded</text>
  <text x="280" y="306" fill="#cbd5e1" font-size="12">true/false — is a collapsible section open?</text>

  <text x="80" y="332" fill="#5eead4" font-size="12" font-weight="600">aria-hidden</text>
  <text x="280" y="332" fill="#cbd5e1" font-size="12">true — remove from accessibility tree entirely</text>

  <text x="80" y="358" fill="#5eead4" font-size="12" font-weight="600">aria-live</text>
  <text x="280" y="358" fill="#cbd5e1" font-size="12">polite/assertive — announce dynamic content changes</text>

  <text x="80" y="384" fill="#5eead4" font-size="12" font-weight="600">aria-disabled</text>
  <text x="280" y="384" fill="#cbd5e1" font-size="12">true — visually + programmatically disabled, stays focusable</text>

  <text x="80" y="410" fill="#5eead4" font-size="12" font-weight="600">aria-checked</text>
  <text x="280" y="410" fill="#cbd5e1" font-size="12">true/false/mixed — custom checkbox/switch state</text>
</svg>
