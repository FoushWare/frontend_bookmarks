<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect width="800" height="440" fill="#0f172a" rx="12"/>

  <text x="400" y="34" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700">&lt;template&gt; — Inert Until Cloned</text>

  <rect x="60" y="56" width="330" height="130" rx="10" fill="#1e293b" stroke="#5eead4" stroke-width="1.5"/>
  <text x="80" y="82" fill="#5eead4" font-size="13" font-weight="700">In the document</text>
  <text x="80" y="108" fill="#cbd5e1" font-size="11">Not rendered</text>
  <text x="80" y="128" fill="#cbd5e1" font-size="11">img/script inside NOT fetched</text>
  <text x="80" y="148" fill="#cbd5e1" font-size="11">Not found by querySelector on</text>
  <text x="80" y="164" fill="#cbd5e1" font-size="11">the main document</text>

  <line x1="400" y1="120" x2="460" y2="120" stroke="#0d9488" stroke-width="2" marker-end="url(#a7)"/>
  <text x="430" y="108" text-anchor="middle" fill="#2dd4bf" font-size="10" font-weight="700">clone</text>
  <defs>
    <marker id="a7" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect x="470" y="56" width="270" height="130" rx="10" fill="#0f766e"/>
  <text x="490" y="82" fill="#ffffff" font-size="13" font-weight="700">appendChild(clone)</text>
  <text x="490" y="108" fill="#e0f2f1" font-size="11">Now rendered</text>
  <text x="490" y="128" fill="#e0f2f1" font-size="11">Images fetch, scripts run</text>
  <text x="490" y="148" fill="#e0f2f1" font-size="11">Fully live DOM content</text>

  <!-- slot section -->
  <text x="400" y="240" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">&lt;slot&gt; — Content Projection in Web Components</text>

  <rect x="150" y="256" width="500" height="150" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="170" y="280" fill="#fbbf24" font-size="12" font-weight="700">&lt;user-card&gt; (light DOM, what you write)</text>
  <text x="190" y="302" fill="#cbd5e1" font-size="11">&lt;span slot="name"&gt;Jane Smith&lt;/span&gt;</text>
  <text x="190" y="322" fill="#cbd5e1" font-size="11">&lt;span slot="title"&gt;Engineer&lt;/span&gt;</text>

  <line x1="400" y1="336" x2="400" y2="352" stroke="#475569" stroke-width="2" marker-end="url(#a8)"/>
  <text x="420" y="348" fill="#94a3b8" font-size="10">projected into</text>
  <defs>
    <marker id="a8" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="190" y="352" width="150" height="34" rx="5" fill="#78350f"/>
  <text x="265" y="373" text-anchor="middle" fill="#fde68a" font-size="10">&lt;slot name="name"&gt;</text>

  <rect x="360" y="352" width="150" height="34" rx="5" fill="#78350f"/>
  <text x="435" y="373" text-anchor="middle" fill="#fde68a" font-size="10">&lt;slot name="title"&gt;</text>

  <text x="400" y="424" text-anchor="middle" fill="#94a3b8" font-size="11">Shadow DOM defines WHERE light-DOM content appears — component internals stay encapsulated</text>
</svg>
