<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect width="800" height="460" fill="#0f172a" rx="12"/>

  <text x="400" y="34" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700">How the Browser Picks an Image</text>

  <rect x="60" y="56" width="680" height="80" rx="8" fill="#1e293b" stroke="#5eead4" stroke-width="1.5"/>
  <text x="80" y="80" fill="#5eead4" font-size="12" font-weight="700">srcset="small.jpg 480w, medium.jpg 800w, large.jpg 1200w"</text>
  <text x="80" y="102" fill="#cbd5e1" font-size="11">sizes="(max-width: 600px) 100vw, 50vw"</text>
  <text x="80" y="120" fill="#94a3b8" font-size="11">Browser knows each candidate's real width, and how wide the slot will be</text>

  <!-- three device scenarios -->
  <rect x="60" y="160" width="210" height="130" rx="8" fill="#134e4a"/>
  <text x="165" y="184" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Phone, 375px</text>
  <text x="80" y="210" fill="#ccfbf1" font-size="11">Slot = 100vw = 375px</text>
  <text x="80" y="230" fill="#ccfbf1" font-size="11">Needs ~375px image</text>
  <rect x="80" y="244" width="150" height="26" rx="4" fill="#0d9488"/>
  <text x="155" y="261" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">→ small.jpg</text>

  <rect x="295" y="160" width="210" height="130" rx="8" fill="#0f766e"/>
  <text x="400" y="184" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Tablet, 900px</text>
  <text x="315" y="210" fill="#e0f2f1" font-size="11">Slot = 50vw = 450px</text>
  <text x="315" y="230" fill="#e0f2f1" font-size="11">Needs ~450px image</text>
  <rect x="315" y="244" width="150" height="26" rx="4" fill="#0d9488"/>
  <text x="390" y="261" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">→ medium.jpg</text>

  <rect x="530" y="160" width="210" height="130" rx="8" fill="#134e4a"/>
  <text x="635" y="184" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Desktop, 2x DPR</text>
  <text x="550" y="210" fill="#ccfbf1" font-size="11">Slot = 50vw = 960px</text>
  <text x="550" y="230" fill="#ccfbf1" font-size="11">Needs ~1920px (2x)</text>
  <rect x="550" y="244" width="150" height="26" rx="4" fill="#0d9488"/>
  <text x="625" y="261" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">→ large.jpg</text>

  <rect x="60" y="320" width="680" height="120" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="80" y="346" fill="#f1f5f9" font-size="13" font-weight="700">&lt;picture&gt; — different scenario: art direction / format switching</text>
  <text x="80" y="372" fill="#cbd5e1" font-size="11">Use srcset/sizes when it's the SAME image at different resolutions</text>
  <text x="80" y="394" fill="#cbd5e1" font-size="11">Use &lt;picture&gt; when you need a DIFFERENT crop/image per breakpoint,</text>
  <text x="80" y="414" fill="#cbd5e1" font-size="11">or to serve modern formats (AVIF/WebP) with a fallback</text>
</svg>
