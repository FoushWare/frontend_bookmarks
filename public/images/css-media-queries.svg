<svg width="600" height="280" viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="600" height="280" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Media Query Breakpoints</text>
  
  <!-- Mobile -->
  <rect x="20" y="50" width="100" height="150" rx="4" fill="#ff6b6b" opacity="0.3" stroke="#ff6b6b" stroke-width="2"/>
  <text x="70" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Mobile</text>
  <text x="70" y="145" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">default</text>
  <text x="70" y="215" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">&lt; 640px</text>
  
  <!-- Tablet -->
  <rect x="140" y="50" width="140" height="150" rx="4" fill="#4ecdc4" opacity="0.3" stroke="#4ecdc4" stroke-width="2"/>
  <text x="210" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Tablet</text>
  <text x="210" y="145" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">@media (min-width: 640px)</text>
  <text x="210" y="215" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">640px - 1024px</text>
  
  <!-- Desktop -->
  <rect x="300" y="50" width="180" height="150" rx="4" fill="#45b7d1" opacity="0.3" stroke="#45b7d1" stroke-width="2"/>
  <text x="390" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Desktop</text>
  <text x="390" y="145" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">@media (min-width: 1024px)</text>
  <text x="390" y="215" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">1024px - 1280px</text>
  
  <!-- Large Desktop -->
  <rect x="500" y="50" width="80" height="150" rx="4" fill="#96ceb4" opacity="0.3" stroke="#96ceb4" stroke-width="2"/>
  <text x="540" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Large</text>
  <text x="540" y="145" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">@media (min-width: 1280px)</text>
  <text x="540" y="215" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">&gt; 1280px</text>
  
  <!-- Arrow indicators -->
  <path d="M 120 125 L 140 125" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 280 125 L 300 125" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 480 125 L 500 125" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Mobile-first label -->
  <text x="300" y="250" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Mobile-First Approach (min-width)</text>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
</svg>
