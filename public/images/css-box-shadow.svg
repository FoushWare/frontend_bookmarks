<svg width="600" height="280" viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="600" height="280" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Box Shadow</text>
  
  <!-- Basic shadow -->
  <rect x="20" y="50" width="130" height="80" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="25" y="55" width="130" height="80" rx="4" fill="none" stroke="#333" stroke-width="2" opacity="0.3"/>
  <text x="85" y="145" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">offset-x offset-y blur</text>
  
  <!-- Subtle shadow -->
  <rect x="170" y="50" width="130" height="80" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="172" y="52" width="130" height="80" rx="4" fill="none" stroke="#333" stroke-width="1" opacity="0.15"/>
  <text x="235" y="145" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">subtle (0 4px 6px)</text>
  
  <!-- Inset shadow -->
  <rect x="320" y="50" width="130" height="80" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="322" y="52" width="126" height="76" rx="2" fill="none" stroke="#333" stroke-width="2" opacity="0.2"/>
  <text x="385" y="145" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">inset</text>
  
  <!-- Multiple shadows -->
  <rect x="470" y="50" width="110" height="80" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="472" y="52" width="110" height="80" rx="4" fill="none" stroke="#333" stroke-width="1" opacity="0.1"/>
  <rect x="474" y="54" width="110" height="80" rx="4" fill="none" stroke="#333" stroke-width="1" opacity="0.05"/>
  <text x="525" y="145" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">multiple</text>
  
  <!-- Shadow anatomy -->
  <rect x="20" y="170" width="200" height="80" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="30" y="180" width="200" height="80" rx="4" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.4"/>
  
  <!-- Labels -->
  <line x1="30" y1="180" x2="30" y2="160" stroke="#ff6b6b" stroke-width="1"/>
  <text x="30" y="155" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ff6b6b">offset-x</text>
  
  <line x1="30" y1="180" x2="10" y2="180" stroke="#4ecdc4" stroke-width="1"/>
  <text x="5" y="183" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="#4ecdc4">offset-y</text>
  
  <circle cx="30" cy="180" r="15" fill="none" stroke="#45b7d1" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="30" y="205" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#45b7d1">blur</text>
  
  <text x="120" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Shadow anatomy</text>
  
  <!-- Color example -->
  <rect x="240" y="170" width="150" height="80" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="242" y="172" width="150" height="80" rx="4" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.3"/>
  <text x="315" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">rgba color</text>
  
  <!-- Spread example -->
  <rect x="410" y="170" width="150" height="80" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="405" y="165" width="160" height="90" rx="4" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.3"/>
  <text x="485" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">spread radius</text>
</svg>
