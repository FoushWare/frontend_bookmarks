<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect width="800" height="480" fill="#0f172a" rx="12"/>

  <text x="400" y="34" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700">tabindex Values</text>

  <rect x="60" y="56" width="220" height="90" rx="8" fill="#0f766e"/>
  <text x="170" y="82" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">tabindex="0"</text>
  <text x="170" y="104" text-anchor="middle" fill="#ccfbf1" font-size="11">Insert into natural</text>
  <text x="170" y="120" text-anchor="middle" fill="#ccfbf1" font-size="11">DOM tab order</text>
  <text x="170" y="136" text-anchor="middle" fill="#5eead4" font-size="10">✓ Use this one</text>

  <rect x="290" y="56" width="220" height="90" rx="8" fill="#7c2d12"/>
  <text x="400" y="82" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">tabindex="-1"</text>
  <text x="400" y="104" text-anchor="middle" fill="#fecaca" font-size="11">Focusable via JS only,</text>
  <text x="400" y="120" text-anchor="middle" fill="#fecaca" font-size="11">skipped by Tab key</text>
  <text x="400" y="136" text-anchor="middle" fill="#fca5a5" font-size="10">For programmatic focus</text>

  <rect x="520" y="56" width="220" height="90" rx="8" fill="#78350f"/>
  <text x="630" y="82" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">tabindex="5"</text>
  <text x="630" y="104" text-anchor="middle" fill="#fde68a" font-size="11">Custom order —</text>
  <text x="630" y="120" text-anchor="middle" fill="#fde68a" font-size="11">breaks DOM flow</text>
  <text x="630" y="136" text-anchor="middle" fill="#f87171" font-size="10">✗ Avoid, anti-pattern</text>

  <!-- focus trap illustration -->
  <text x="400" y="184" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">Focus Trap in a Modal</text>
  <text x="400" y="202" text-anchor="middle" fill="#94a3b8" font-size="12">Tab cycles within the dialog, never escapes to background content</text>

  <rect x="200" y="220" width="400" height="200" rx="12" fill="#1e293b" stroke="#5eead4" stroke-width="2"/>
  <text x="220" y="248" fill="#5eead4" font-size="13" font-weight="700">role="dialog" aria-modal="true"</text>

  <rect x="230" y="264" width="130" height="34" rx="6" fill="#0f766e"/>
  <text x="295" y="286" text-anchor="middle" fill="#ffffff" font-size="11">Name field</text>

  <rect x="380" y="264" width="130" height="34" rx="6" fill="#0f766e"/>
  <text x="445" y="286" text-anchor="middle" fill="#ffffff" font-size="11">Email field</text>

  <rect x="230" y="316" width="130" height="34" rx="6" fill="#0f766e"/>
  <text x="295" y="338" text-anchor="middle" fill="#ffffff" font-size="11">Cancel</text>

  <rect x="380" y="316" width="130" height="34" rx="6" fill="#0d9488"/>
  <text x="445" y="338" text-anchor="middle" fill="#ffffff" font-size="11">Save</text>

  <!-- cycle arrows -->
  <path d="M 360 281 L 378 281" stroke="#2dd4bf" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>
  <path d="M 445 298 L 445 314" stroke="#2dd4bf" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>
  <path d="M 378 333 L 362 333" stroke="#2dd4bf" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>
  <path d="M 295 314 Q 260 260 280 265" stroke="#2dd4bf" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>

  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <text x="400" y="450" text-anchor="middle" fill="#94a3b8" font-size="12">Focus returns to the trigger button when the dialog closes</text>
</svg>
