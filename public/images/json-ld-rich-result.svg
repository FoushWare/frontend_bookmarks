<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect width="800" height="460" fill="#0f172a" rx="12"/>

  <text x="400" y="34" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700">JSON-LD → Rich Search Result</text>

  <!-- json-ld block -->
  <rect x="60" y="56" width="330" height="240" rx="10" fill="#1e293b" stroke="#5eead4" stroke-width="1.5"/>
  <text x="80" y="82" fill="#5eead4" font-size="12" font-weight="700">&lt;script type="application/ld+json"&gt;</text>
  <text x="90" y="106" fill="#cbd5e1" font-size="10">{</text>
  <text x="104" y="124" fill="#cbd5e1" font-size="10">"@context": "schema.org",</text>
  <text x="104" y="142" fill="#cbd5e1" font-size="10">"@type": "Product",</text>
  <text x="104" y="160" fill="#cbd5e1" font-size="10">"name": "Trail Runner Pro",</text>
  <text x="104" y="178" fill="#cbd5e1" font-size="10">"image": "shoe.jpg",</text>
  <text x="104" y="196" fill="#cbd5e1" font-size="10">"offers": {</text>
  <text x="118" y="214" fill="#cbd5e1" font-size="10">"@type": "Offer",</text>
  <text x="118" y="232" fill="#cbd5e1" font-size="10">"price": "89.99",</text>
  <text x="118" y="250" fill="#cbd5e1" font-size="10">"priceCurrency": "USD"</text>
  <text x="104" y="268" fill="#cbd5e1" font-size="10">}</text>
  <text x="90" y="284" fill="#cbd5e1" font-size="10">}</text>

  <!-- arrow -->
  <line x1="400" y1="176" x2="460" y2="176" stroke="#0d9488" stroke-width="2" marker-end="url(#a5)"/>
  <text x="430" y="164" text-anchor="middle" fill="#2dd4bf" font-size="10" font-weight="700">crawled</text>
  <defs>
    <marker id="a5" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0d9488"/>
    </marker>
  </defs>

  <!-- search result -->
  <rect x="470" y="56" width="270" height="240" rx="10" fill="#ffffff"/>
  <text x="490" y="82" fill="#1a73e8" font-size="14" font-weight="600">Trail Runner Pro</text>
  <text x="490" y="100" fill="#006621" font-size="10">example.com › products</text>

  <text x="490" y="126" fill="#5f6368" font-size="10">★★★★☆ 4.5 (238) · $89.99</text>
  <text x="490" y="146" fill="#4d5156" font-size="10">Lightweight trail running shoes</text>
  <text x="490" y="162" fill="#4d5156" font-size="10">engineered for rocky terrain...</text>

  <rect x="490" y="178" width="80" height="60" rx="4" fill="#134e4a"/>
  <text x="530" y="212" text-anchor="middle" fill="#5eead4" font-size="9">[image]</text>

  <text x="490" y="256" fill="#188038" font-size="10" font-weight="600">In stock</text>

  <rect x="60" y="320" width="680" height="110" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="80" y="346" fill="#f1f5f9" font-size="13" font-weight="700">Common schema.org types you'll actually use</text>
  <text x="80" y="372" fill="#cbd5e1" font-size="11">Product · Article · Recipe · Organization · BreadcrumbList</text>
  <text x="80" y="394" fill="#cbd5e1" font-size="11">FAQPage · Review · LocalBusiness · Event</text>
  <text x="80" y="418" fill="#94a3b8" font-size="11">Structured data ≠ ranking boost — it's eligibility for RICH result formatting</text>
</svg>
