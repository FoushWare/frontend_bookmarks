<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect width="800" height="480" fill="#0f172a" rx="12"/>

  <!-- DOCTYPE -->
  <rect x="280" y="20" width="240" height="36" rx="6" fill="#334155" stroke="#0d9488" stroke-width="1.5"/>
  <text x="400" y="43" text-anchor="middle" fill="#2dd4bf" font-size="14" font-weight="600">&lt;!DOCTYPE html&gt;</text>

  <!-- line -->
  <line x1="400" y1="56" x2="400" y2="80" stroke="#475569" stroke-width="2"/>

  <!-- html -->
  <rect x="300" y="80" width="200" height="40" rx="6" fill="#0d9488"/>
  <text x="400" y="105" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">&lt;html lang="en"&gt;</text>

  <!-- lines to head/body -->
  <line x1="400" y1="120" x2="220" y2="160" stroke="#475569" stroke-width="2"/>
  <line x1="400" y1="120" x2="580" y2="160" stroke="#475569" stroke-width="2"/>

  <!-- head -->
  <rect x="100" y="160" width="240" height="40" rx="6" fill="#1e293b" stroke="#5eead4" stroke-width="1.5"/>
  <text x="220" y="185" text-anchor="middle" fill="#5eead4" font-size="14" font-weight="600">&lt;head&gt;</text>

  <!-- body -->
  <rect x="460" y="160" width="240" height="40" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="580" y="185" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="600">&lt;body&gt;</text>

  <!-- head children -->
  <line x1="220" y1="200" x2="220" y2="220" stroke="#475569" stroke-width="1.5"/>
  <rect x="90" y="220" width="260" height="30" rx="5" fill="#1e293b" stroke="#334155"/>
  <text x="220" y="240" text-anchor="middle" fill="#cbd5e1" font-size="12">&lt;meta charset="UTF-8"&gt;</text>

  <line x1="220" y1="250" x2="220" y2="264" stroke="#475569" stroke-width="1.5"/>
  <rect x="70" y="264" width="300" height="30" rx="5" fill="#1e293b" stroke="#334155"/>
  <text x="220" y="284" text-anchor="middle" fill="#cbd5e1" font-size="12">&lt;meta name="viewport" ...&gt;</text>

  <line x1="220" y1="294" x2="220" y2="308" stroke="#475569" stroke-width="1.5"/>
  <rect x="120" y="308" width="200" height="30" rx="5" fill="#1e293b" stroke="#334155"/>
  <text x="220" y="328" text-anchor="middle" fill="#cbd5e1" font-size="12">&lt;title&gt;Page Title&lt;/title&gt;</text>

  <line x1="220" y1="338" x2="220" y2="352" stroke="#475569" stroke-width="1.5"/>
  <rect x="100" y="352" width="240" height="30" rx="5" fill="#1e293b" stroke="#334155"/>
  <text x="220" y="372" text-anchor="middle" fill="#cbd5e1" font-size="12">&lt;link rel="stylesheet" ...&gt;</text>

  <!-- body children -->
  <line x1="580" y1="200" x2="580" y2="220" stroke="#475569" stroke-width="1.5"/>
  <rect x="470" y="220" width="220" height="30" rx="5" fill="#1e293b" stroke="#334155"/>
  <text x="580" y="240" text-anchor="middle" fill="#cbd5e1" font-size="12">&lt;header&gt;...&lt;/header&gt;</text>

  <line x1="580" y1="250" x2="580" y2="264" stroke="#475569" stroke-width="1.5"/>
  <rect x="470" y="264" width="220" height="30" rx="5" fill="#1e293b" stroke="#334155"/>
  <text x="580" y="284" text-anchor="middle" fill="#cbd5e1" font-size="12">&lt;main&gt;...&lt;/main&gt;</text>

  <line x1="580" y1="294" x2="580" y2="308" stroke="#475569" stroke-width="1.5"/>
  <rect x="470" y="308" width="220" height="30" rx="5" fill="#1e293b" stroke="#334155"/>
  <text x="580" y="328" text-anchor="middle" fill="#cbd5e1" font-size="12">&lt;footer&gt;...&lt;/footer&gt;</text>

  <line x1="580" y1="338" x2="580" y2="352" stroke="#475569" stroke-width="1.5"/>
  <rect x="500" y="352" width="160" height="30" rx="5" fill="#334155" stroke="#f59e0b" stroke-dasharray="3,3"/>
  <text x="580" y="372" text-anchor="middle" fill="#fbbf24" font-size="12">&lt;script defer&gt;</text>

  <!-- legend -->
  <text x="220" y="415" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600">Not rendered — metadata only</text>
  <text x="580" y="415" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600">Rendered — visible page content</text>

  <rect x="60" y="435" width="680" height="1" fill="#334155"/>
  <text x="400" y="460" text-anchor="middle" fill="#64748b" font-size="12">head → page metadata &nbsp;|&nbsp; body → what the user actually sees</text>
</svg>
