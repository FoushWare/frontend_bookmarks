<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect width="800" height="460" fill="#0f172a" rx="12"/>

  <text x="400" y="34" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700">Accessible Name Computation Order</text>
  <text x="400" y="54" text-anchor="middle" fill="#94a3b8" font-size="12">Browser checks these top to bottom — first match wins</text>

  <!-- priority steps -->
  <rect x="80" y="76" width="640" height="52" rx="8" fill="#0f766e"/>
  <text x="104" y="98" fill="#ffffff" font-size="13" font-weight="700">1. aria-labelledby</text>
  <text x="104" y="117" fill="#ccfbf1" font-size="11">References another element's text as the name</text>

  <line x1="400" y1="128" x2="400" y2="142" stroke="#475569" stroke-width="2"/>

  <rect x="80" y="142" width="640" height="52" rx="8" fill="#134e4a"/>
  <text x="104" y="164" fill="#ffffff" font-size="13" font-weight="700">2. aria-label</text>
  <text x="104" y="183" fill="#ccfbf1" font-size="11">Explicit string, not visible on screen</text>

  <line x1="400" y1="194" x2="400" y2="208" stroke="#475569" stroke-width="2"/>

  <rect x="80" y="208" width="640" height="52" rx="8" fill="#0f766e" opacity="0.75"/>
  <text x="104" y="230" fill="#ffffff" font-size="13" font-weight="700">3. Native labeling (label element, alt, etc.)</text>
  <text x="104" y="249" fill="#ccfbf1" font-size="11">&lt;label for&gt;, img alt, table caption</text>

  <line x1="400" y1="260" x2="400" y2="274" stroke="#475569" stroke-width="2"/>

  <rect x="80" y="274" width="640" height="52" rx="8" fill="#134e4a" opacity="0.75"/>
  <text x="104" y="296" fill="#ffffff" font-size="13" font-weight="700">4. Visible text content</text>
  <text x="104" y="315" fill="#ccfbf1" font-size="11">The text inside a button/link itself</text>

  <line x1="400" y1="326" x2="400" y2="340" stroke="#475569" stroke-width="2"/>

  <rect x="80" y="340" width="640" height="52" rx="8" fill="#78350f" opacity="0.85"/>
  <text x="104" y="362" fill="#ffffff" font-size="13" font-weight="700">5. title attribute (last resort — weak support)</text>
  <text x="104" y="381" fill="#fde68a" font-size="11">Tooltip only, unreliable for screen readers</text>

  <rect x="60" y="410" width="680" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="400" y="434" text-anchor="middle" fill="#e2e8f0" font-size="12">aria-labelledby and aria-label always override visible text — use with care</text>
</svg>
