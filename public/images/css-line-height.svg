<svg width="600" height="250" viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="600" height="250" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Line Height</text>
  
  <!-- Example 1: line-height: 1 (tight) -->
  <rect x="20" y="50" width="170" height="80" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="105" y="70" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">Line 1</text>
  <text x="105" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">Line 2</text>
  <text x="105" y="110" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">Line 3</text>
  <text x="105" y="145" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">line-height: 1</text>
  
  <!-- Example 2: line-height: 1.5 (comfortable) -->
  <rect x="215" y="50" width="170" height="80" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="300" y="65" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">Line 1</text>
  <text x="300" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">Line 2</text>
  <text x="300" y="115" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">Line 3</text>
  <text x="300" y="145" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">line-height: 1.5</text>
  
  <!-- Example 3: line-height: 2 (loose) -->
  <rect x="410" y="50" width="170" height="80" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="495" y="60" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">Line 1</text>
  <text x="495" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">Line 2</text>
  <text x="495" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">Line 3</text>
  <text x="495" y="145" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">line-height: 2</text>
  
  <!-- Visual explanation -->
  <rect x="20" y="160" width="560" height="70" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="300" y="180" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">Visual Explanation</text>
  
  <!-- Line height box -->
  <rect x="50" y="190" width="100" height="30" fill="#ff6b6b" opacity="0.3" stroke="#ff6b6b" stroke-width="1"/>
  <text x="100" y="210" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">line-height</text>
  
  <!-- Font size box -->
  <rect x="170" y="200" width="60" height="20" fill="#4ecdc4" opacity="0.3" stroke="#4ecdc4" stroke-width="1"/>
  <text x="200" y="215" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">font-size</text>
  
  <!-- Arrow -->
  <path d="M 120 205 L 170 205" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  
  <text x="300" y="220" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">Unitless value (1.5) = 1.5 × font-size</text>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
</svg>
