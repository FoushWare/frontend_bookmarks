<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect width="800" height="420" fill="#0f172a" rx="12"/>

  <text x="400" y="34" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700">&lt;video&gt; Element Structure</text>

  <rect x="150" y="56" width="500" height="280" rx="10" fill="#1e293b" stroke="#5eead4" stroke-width="2"/>
  <text x="170" y="82" fill="#5eead4" font-size="13" font-weight="700">&lt;video controls preload="metadata" poster="thumb.jpg"&gt;</text>

  <rect x="180" y="98" width="440" height="40" rx="6" fill="#0f766e"/>
  <text x="200" y="122" fill="#ffffff" font-size="12">&lt;source src="video.webm" type="video/webm"&gt;</text>

  <rect x="180" y="146" width="440" height="40" rx="6" fill="#134e4a"/>
  <text x="200" y="170" fill="#ccfbf1" font-size="12">&lt;source src="video.mp4" type="video/mp4"&gt;</text>

  <rect x="180" y="194" width="440" height="40" rx="6" fill="#78350f"/>
  <text x="200" y="218" fill="#fde68a" font-size="12">&lt;track kind="captions" src="en.vtt" srclang="en"&gt;</text>

  <rect x="180" y="242" width="440" height="40" rx="6" fill="#334155"/>
  <text x="200" y="266" fill="#e2e8f0" font-size="12">Fallback text for unsupported browsers</text>

  <text x="400" y="300" text-anchor="middle" fill="#94a3b8" font-size="11">Browser tries &lt;source&gt; elements top to bottom,</text>
  <text x="400" y="316" text-anchor="middle" fill="#94a3b8" font-size="11">picks the first format it can play</text>

  <rect x="60" y="356" width="680" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="400" y="386" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Autoplay only works if muted (or the user already interacted with the page)</text>
</svg>
