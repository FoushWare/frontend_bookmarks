<svg width="600" height="350" viewBox="0 0 600 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="600" height="350" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">CSS Box Model</text>
  
  <!-- Margin (outermost) -->
  <rect x="50" y="60" width="500" height="250" fill="#ff6b6b" opacity="0.2" stroke="#ff6b6b" stroke-width="2"/>
  <text x="30" y="185" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#ff6b6b" transform="rotate(-90, 30, 185)">margin</text>
  
  <!-- Border -->
  <rect x="100" y="80" width="400" height="210" fill="#4ecdc4" opacity="0.3" stroke="#4ecdc4" stroke-width="4"/>
  <text x="80" y="185" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#4ecdc4" transform="rotate(-90, 80, 185)">border</text>
  
  <!-- Padding -->
  <rect x="150" y="100" width="300" height="170" fill="#45b7d1" opacity="0.3" stroke="#45b7d1" stroke-width="2"/>
  <text x="130" y="185" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#45b7d1" transform="rotate(-90, 130, 185)">padding</text>
  
  <!-- Content -->
  <rect x="200" y="120" width="200" height="130" fill="#96ceb4" opacity="0.5" stroke="#96ceb4" stroke-width="2"/>
  <text x="300" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">content</text>
  
  <!-- Dimensions labels -->
  <text x="300" y="325" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">width</text>
  <line x1="200" y1="310" x2="400" y2="310" stroke="#333" stroke-width="1"/>
  <line x1="200" y1="305" x2="200" y2="315" stroke="#333" stroke-width="1"/>
  <line x1="400" y1="305" x2="400" y2="315" stroke="#333" stroke-width="1"/>
  
  <text x="560" y="185" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333" transform="rotate(90, 560, 185)">height</text>
  <line x1="545" y1="120" x2="545" y2="250" stroke="#333" stroke-width="1"/>
  <line x1="540" y1="120" x2="550" y2="120" stroke="#333" stroke-width="1"/>
  <line x1="540" y1="250" x2="550" y2="250" stroke="#333" stroke-width="1"/>
  
  <!-- Legend -->
  <rect x="50" y="330" width="15" height="15" fill="#ff6b6b" opacity="0.2" stroke="#ff6b6b" stroke-width="1"/>
  <text x="70" y="342" font-family="Arial, sans-serif" font-size="11" fill="#333">margin</text>
  
  <rect x="130" y="330" width="15" height="15" fill="#4ecdc4" opacity="0.3" stroke="#4ecdc4" stroke-width="2"/>
  <text x="150" y="342" font-family="Arial, sans-serif" font-size="11" fill="#333">border</text>
  
  <rect x="210" y="330" width="15" height="15" fill="#45b7d1" opacity="0.3" stroke="#45b7d1" stroke-width="1"/>
  <text x="230" y="342" font-family="Arial, sans-serif" font-size="11" fill="#333">padding</text>
  
  <rect x="290" y="330" width="15" height="15" fill="#96ceb4" opacity="0.5" stroke="#96ceb4" stroke-width="1"/>
  <text x="310" y="342" font-family="Arial, sans-serif" font-size="11" fill="#333">content</text>
</svg>
